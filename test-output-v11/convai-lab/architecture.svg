  <text x="427.0" y="1072.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Invoke convai-eval (ceval simulate + judge)</text>
  <text x="427.0" y="1087.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sim model + judge model (Gemma-4-26B default)</text>
  <text x="427.0" y="1102.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">--batch-size 4 concurrent scenarios</text>
