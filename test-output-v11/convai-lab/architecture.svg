  <text x="427.0" y="860.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sweep.py — iterate eval_params × cells</text>
  <text x="427.0" y="875.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sequential cells (shared Postgres + port)</text>
  <text x="427.0" y="890.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">--smoke marks non-citable · keep-going default</text>
  <text x="427.0" y="966.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">run_ceval.py — boot realtime-text</text>
  <text x="427.0" y="981.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">managed_realtime(cell.env) via uvicorn</text>
