  <text x="435.0" y="198.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">2. Query Generation</text>
  <text x="435.0" y="213.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">query model (deepseek-v4-flash, temp=0.7) → realistic user message</text>
  <text x="435.0" y="268.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">3. Answer Decision</text>
