  <text x="413.5" y="46.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#333">Config &amp; Inputs</text>
  <text x="153.0" y="96.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">eval_params.py</text>
  <text x="153.0" y="111.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">7 named batteries: lab_prompts, harvest_tool_200,</text>
  <text x="153.0" y="126.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">suite_full; --max-turns 3, --persona-db-dir</text>
  <text x="408.0" y="96.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">setups/experimental_tools/</text>
  <text x="408.0" y="111.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">one JSON per cell: prompt_{arm}_env_{env}[_think].json</text>
  <text x="408.0" y="126.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">pins EXPERIMENTAL_ENV + EXPERIMENTAL_TOOLS_DIR</text>
  <text x="668.0" y="96.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">prompt_arms/ (p0-p11)</text>
  <text x="668.0" y="111.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">frozen system prompts composed from sections/;</text>
  <text x="668.0" y="126.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">portable (p1-p6) vs coupled (p7-p10)</text>
  <text x="413.5" y="206.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#333">Pipeline (runners/)</text>
  <text x="153.0" y="262.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sweep.py</text>
  <text x="153.0" y="277.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">matrix driver: eval_params x cells;</text>
  <text x="153.0" y="292.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sequential cells, prints ceval_table between runs</text>
  <text x="408.0" y="262.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">run_ceval.py</text>
  <text x="408.0" y="277.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">launches one cell: boots realtime, resolves</text>
  <text x="408.0" y="292.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">provenance (lab+convai SHA), writes metadata.json</text>
  <text x="668.0" y="262.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">convai-eval (ceval simulate)</text>
  <text x="668.0" y="277.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">3 models: assistant + sim customer + judge</text>
  <text x="668.0" y="292.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(gemma-4-26B-A4B-it on localhost:8080)</text>
  <text x="413.5" y="415.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#333">Environments (frozen)</text>
  <text x="153.0" y="467.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">registry.py</text>
  <text x="153.0" y="482.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">resolves env name (e0-e15) via importlib;</text>
  <text x="153.0" y="497.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">loads manifest + tools + logic per arm</text>
  <text x="408.0" y="467.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">e0-e15 (tool snapshots)</text>
  <text x="408.0" y="482.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">manifest.py + tools.py + logic.py per env;</text>
  <text x="408.0" y="497.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">two families: tool ladder (e2-e10) &amp; chart (e12-e14)</text>
  <text x="668.0" y="467.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">_charts_v1 / _charts_v2</text>
  <text x="668.0" y="482.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">frozen product chart pipeline copies;</text>
  <text x="668.0" y="497.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">stdlib-only logic, never imports live product</text>
  <text x="413.5" y="616.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#333">View (results readers)</text>
  <text x="218.0" y="669.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">ceval_table.py</text>
  <text x="218.0" y="684.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">metric vector per cell (rubric, completeness,</text>
  <text x="218.0" y="699.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">groundedness); flags mixed judges/batteries</text>
  <text x="578.0" y="669.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">view/app (React/Vite)</text>
  <text x="578.0" y="684.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">renders charts via pinned product renderer;</text>
  <text x="578.0" y="699.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">ceval_to_responses.py adapts turns.jsonl</text>
  <text x="26.0" y="754.0" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">Colour Legend</text>
